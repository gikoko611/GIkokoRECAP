name: Android Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk GIkokoVideoRecap-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIkokoVideoRecap-APK
          path: GIkokoVideoRecap-debug.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" GIkokoVideoRecap-debug.apk --clobber
          else
            gh release create "$TAG" GIkokoVideoRecap-debug.apk \
              --title "GIkoko Video Recap $TAG" \
              --notes "Auto build from GitHub Actions. GIkoko Video Recap - Cyber 3D UI app (Home UI + WebView studio). Debug APK: download and install directly on your phone (enable Unknown sources)."
          fi
